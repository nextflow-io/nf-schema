name: Check examples
on:
  push:
    tags-ignore:
      - '*'
  pull_request:
jobs:
  check_examples:
    name: Check examples output
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # ratchet:actions/checkout@v3
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup Java 21
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # ratchet:actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'adopt'
          architecture: x64
          cache: gradle

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@6c2e22b4d901f0c42ca66c5069f8026df026d165 # ratchet:nf-core/setup-nextflow@v2
        with:
          version: "latest-stable"

      - name: Install nf-schema
        run: make install

      - name: Check examples
        run: bash examples/check_examples.sh
